{{ define "main" }}


<!-- Image and Affiliations -->

<section id="about" class="bg-alt" style="border-top: 1px solid rgba(255,255,255,0.1);">
  <div class="bio-section">
    <div class="bio-image">
      <div class="profile-header-container">
  
  <!-- Left Side: Your Main Portrait -->
  <div class="main-portrait-box">
    <img src="img/face.png" class="terminal-avatar" alt="Peter Lord">
  </div>

    <!-- Right Side: Your Affiliations Grid -->
<div class="affiliations-box">
  <span class="affiliation-label">AFFILIATIONS</span>
  <div class="logo-grid">
    
    <!-- University Logo Link -->
    <a href="https://www.sheffield.ac.uk/" 
       target="_blank" 
       rel="noopener noreferrer" 
       style="display: inline-block; text-decoration: none !important; border: none !important; outline: none !important; background: none !important; box-shadow: none !important;">
      <img src="img/Medium-UOSLogo_Primary_Violet_RGB.jpg" class="affiliation-logo" alt="University Logo" style="border: none !important; outline: none !important;">
    </a>

    <!-- Wellcome Trust Logo Link -->
    <a href="https://wellcome.org/" 
       target="_blank" 
       rel="noopener noreferrer" 
       style="display: inline-block; text-decoration: none !important; border: none !important; outline: none !important; background: none !important; box-shadow: none !important;">
      <img src="img/Funded_by_Wellcome_logo_off_Black.png" class="affiliation-logo" alt="Research Lab Logo" style="border: none !important; outline: none !important;">
    </a>
    
  </div>
</div>

  </div>
</section>

<!-- Hero Section -->
<section class="hero" id="about-hero">
  <div class="boxed">
    <span class="eyebrow">{{ .Site.Params.wellcome_trust_tagline }}</span>
    <div style="border-left: 3px solid #62c4ff; padding-left: 15px; margin: 20px 0; font-family: monospace;">
      <!-- The Command Prompt -->
      <span style="color: #62c4ff;">$ mpirun -n 4 python3 phd</span>
  
      <!-- The typed output area with a blinking terminal cursor -->
      <p style="margin-top: 8px; font-style: italic; font-size: 1.1em; line-height: 1.6; min-height: 80px;">
      <span id="typed-text"></span><span class="terminal-cursor">|</span>
      </p>
    </div>

  <!-- Blinking Cursor Styling -->
  <style>
    .terminal-cursor {
      color: #62c4ff;
      font-weight: bold;
      animation: blink 1s step-start infinite;
    }
    @keyframes blink {
      50% { opacity: 0; }
    }
  </style>

  <!-- Typewriter JavaScript -->
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const text = "Can integrating empirical information into the generation of social networks contribute to more realistic agent-based models and better public health policy decision-making?";
      const delay = 35; // Speed of typing (lower is faster)
      let i = 0;
      const target = document.getElementById("typed-text");
      
      function typeWriter() {
        if (i < text.length) {
          target.innerHTML += text.charAt(i);
          i++;
          setTimeout(typeWriter, delay);
        }
      }
      
      // Start typing after a half-second delay so the user catches the start
      setTimeout(typeWriter, 500);
    });
  </script>
    </div>
</section>

<hr>




<!-- loads the main content of the page, which is the content of the markdown file for the page. In this case, it will load the content of the content/_index.md file. -->

    <h1 class="page-title">{{ .Title }}</h1>

</main>
